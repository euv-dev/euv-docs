# euv-docs site configuration.
#
# This file replaces VuePress's `.vuepress/config.ts`. The build script
# (`build.rs`) reads it together with every `**/*.md` file under `docs/`.

[site]
title = "euv-docs"
description = "A VuePress-style documentation site powered by euv + euv-ui."
logo = "📘"

# ── Locales ─────────────────────────────────────────────────────────────────
# `prefix` is the route prefix of the locale. Markdown files for a non-root
# locale live in a directory named after it (`docs/zh/` for `/zh/`).

[[locales]]
prefix = "/"
lang = "en-US"
label = "English"
title = "euv-docs"
description = "A VuePress-style documentation site powered by euv + euv-ui."
footer = "MIT Licensed | Built with euv + euv-ui"
toc_label = "On this page"
prev_label = "Previous"
next_label = "Next"
navbar = [
  { text = "Home", link = "/" },
  { text = "Guide", link = "/guide/" },
  { text = "GitHub", link = "https://github.com/euv-dev/euv-docs" },
]

[[locales]]
prefix = "/zh/"
lang = "zh-CN"
label = "简体中文"
title = "euv-docs"
description = "由 euv + euv-ui 驱动的 VuePress 风格文档站。"
footer = "MIT 许可 | 基于 euv + euv-ui 构建"
toc_label = "本页目录"
prev_label = "上一页"
next_label = "下一页"
navbar = [
  { text = "首页", link = "/zh/" },
  { text = "指南", link = "/zh/guide/" },
  { text = "GitHub", link = "https://github.com/euv-dev/euv-docs" },
]
